<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Treino Fit</title>

    <!-- ✅ CORRIGIDO: Agora ele usa a sua logo192 que já existe na pasta public -->
    <link rel="icon" type="image/png" href="/logo192.png" />

    <!-- descrição para SEO -->
    <meta name="description" content="Treino Fit - Assistente inteligente para treinos e alimentação saudável." />

    <!-- cor da barra no mobile -->
    <meta name="theme-color" content="#10b981" />

    <!-- 👇 SCRIPT NINJA ADICIONADO AQUI 👇 -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        // Verifica se na barra de endereços do navegador tem a palavra "/personal"
        if (window.location.pathname.includes('/personal')) {
          // Procura a tag de manifest que o Vite cria automaticamente
          const manifestTag = document.querySelector('link[rel="manifest"]');
          
          if (manifestTag) {
            // Se achar, troca silenciosamente para o do Personal!
            manifestTag.href = '/manifest-personal.json';
          }
        }
      });
    </script>
    <!-- 👆 FIM DO SCRIPT NINJA 👆 -->

  </head>
  
  <!-- ✅ CORRIGIDO: Deixei apenas UM body, unindo as cores -->
  <body class="bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
